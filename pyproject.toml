[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flatcam"
dynamic = ["version"]
description = "2D Computer-Aided PCB Manufacturing"
requires-python = ">=3.12"
dependencies = [
    "pyqt5>=5.12.1,<6",
    "numpy>=1.16,<3",
    "matplotlib>=3.1,<4",
    "shapely>=2,<3",
    "rtree>=1,<2",
    "vispy>=0.12,<1",
    "svg.path>=4.0,<7",
    "simplejson>=3,<4",
    "freetype-py>=2,<3",
    "fontTools>=4,<5",
    "rasterio>=1.3,<2",
    "lxml>=4,<6",
    "ezdxf>=1,<2",
    "qrcode>=6.1,<8",
    "reportlab>=3.5,<5",
    "svglib>=0.9,<1",
    "pyserial>=3.4,<4",
    "pyopengl>=3,<4",
    "dill>=0.3,<1",
]

[project.optional-dependencies]
optimization = ["ortools>=9,<10"]

[project.scripts]
flatcam = "flatcam.__main__:main"

[dependency-groups]
dev = ["pytest", "setuptools>=69,<83", "py2app>=0.28.8,<1; sys_platform == 'darwin'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "flatcam.__version__"}

[tool.uv]
python-preference = "managed"
